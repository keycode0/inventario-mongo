services:
  backend:
    build:
      context: ./backend
    container_name: django_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"   # 👈 cambiamos el puerto del HOST
    env_file:
      - .env.dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONPATH: /app
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: mongo_db
    volumes:
      - mongo_data:/data/db
  

volumes:
  mongo_data:
