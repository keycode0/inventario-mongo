version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: django_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONPATH: /app
    command: sleep infinity
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
